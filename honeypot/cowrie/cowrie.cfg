# Cowrie overrides for the NSM honeypot (Cowrie 3.0.14). Everything not set here keeps the defaults from
# src/cowrie/data/etc/cowrie.cfg.dist inside the image.
#
# Outbound traffic: Cowrie's wget, curl, tftp, nc and ftpget commands open real connections to attacker-chosen hosts,
# and SSH direct-tcpip forwarding would relay traffic. That would generate traffic toward targets we do not own, so:
#   1. the honeypot VPC denies all egress except Google APIs (infra/terraform/honeypot.tf) — the actual guarantee
#   2. forwarding is off and the download commands are rate limited to 1 connection per host here — defense in depth

[honeypot]
# A plausible name instead of the well-known default "svr04", which scanners fingerprint
hostname = web-prod-02
# Stable name in every event (the default is the container ID, which changes on every rebuild)
sensor_name = nsm-honeypot-1
logtype = rotating
timezone = UTC
# Cap files attackers upload over SFTP/scp (the downloads directory is on the VM's small boot disk)
download_limit_size = 1048576

[shell]
wget_rate_limit_requests = 1
curl_rate_limit_requests = 1
nc_rate_limit_requests = 1
ftpget_rate_limit_requests = 1
tftp_rate_limit_requests = 1

[ssh]
enabled = true
listen_endpoints = tcp:2222:interface=0.0.0.0
forwarding = false
forward_redirect = false
forward_tunnel = false

[telnet]
enabled = false

[output_jsonlog]
enabled = true
logfile = ${honeypot:log_path}/cowrie.json
epoch_timestamp = false
